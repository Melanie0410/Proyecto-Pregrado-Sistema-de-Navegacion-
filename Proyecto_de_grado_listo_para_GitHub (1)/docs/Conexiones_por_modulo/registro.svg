<svg xmlns="http://www.w3.org/2000/svg" id="architecture" viewBox="0 0 1740 810" width="1740" height="810" font-family="Arial, sans-serif" role="group" aria-label="Registro de pruebas"><rect width="1740" height="810" fill="#fbfcfe" /><defs><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#13836d" /></marker><marker id="arrow-interaction" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#8b58bc" /></marker><marker id="arrow-decision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-motion" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-supervision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#c57024" /></marker><marker id="arrow-record" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker></defs><text x="45" y="48" fill="#18334a" font-size="27" font-weight="700" text-anchor="start">Registro de pruebas</text><text x="45" y="80" fill="#6b7f92" font-size="15" font-weight="400" text-anchor="start">Conexiones completas del módulo · Entradas a la izquierda · Salidas a la derecha</text><text x="45" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">ORIGEN DE LAS ENTRADAS</text><text x="740" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">MÓDULO SELECCIONADO</tex