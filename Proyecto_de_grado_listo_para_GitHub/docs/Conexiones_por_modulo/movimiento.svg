<svg xmlns="http://www.w3.org/2000/svg" id="architecture" viewBox="0 0 1740 690" width="1740" height="690" font-family="Arial, sans-serif" role="group" aria-label="Interfaz de comandos de movimiento"><rect width="1740" height="690" fill="#fbfcfe" /><defs><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#13836d" /></marker><marker id="arrow-interaction" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#8b58bc" /></marker><marker id="arrow-decision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-motion" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-supervision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#c57024" /></marker><marker id="arrow-record" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker></defs><text x="45" y="48" fill="#18334a" font-size="27" font-weight="700" text-anchor="start">Interfaz de comandos de movimiento</text><text x="45" y="80" fill="#6b7f92" font-size="15" font-weight="400" text-anchor="start">Conexiones completas del módulo · Entradas a la izquierda · Salidas a la derecha</text><text x="45" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">ORIGEN DE LAS ENTRADAS</text><text x="740" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">MÓDULO SELECCIONADO</text><text x="1395" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">DESTINO DE LAS SALIDAS</text><g class="edge" data-flow="F17"><title>F17 · Comandos de avance, giro y detención</title><path class="wire" d="M345 317.5 L605 317.5 C660 317.5 665 375.5 720 375.5" stroke="#2563b9" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-decision)" /><text x="475" y="286.5" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F17 · Comandos de avance,</text><text x="475" y="303.5" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">giro y detención</text></g><g class="edge" data-flow="F26"><title>F26 · Detención prioritaria o habilitación</title><path class="wire" d="M345 462.5 L605 462.5 C660 462.5 665 404.5 720 404.5" stroke="#c57024" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-supervision)" /><text x="475" y="431.5" class="flow-label" text-anchor="middle" fill="#c57024" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F26 · Detención prioritaria o</text><text x="475" y="448.5" class="flow-label" text-anchor="middle" fill="#c57024" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">habilitación</text></g><g class="edge" data-flow="F18"><title>F18 · Comandos adaptados al controlador</title><path class="wire" d="M1060 390.0 C1115 390.0 1115 390.0 1170 390.0 L1395 390.0" stroke="#2563b9" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-motion)" /><text x="1270" y="359.0" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F18 · Comandos adaptados al</text><text x="1270" y="376.0" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">controlador</text></g><g class="node" data-node="movimiento" role="button" tabindex="0" aria-label="Interfaz de comandos de movimiento"><rect class="node-bg" x="720" y="285.0" width="340" height="210" rx="14" fill="#edf4fd" stroke="#2563b9" stroke-width="2.3" /><rect x="720" y="303.0" width="4" height="174" rx="2" fill="#2563b9" /><text x="740" y="322.0" fill="#2563b9" font-size="18" font-weight="700" text-anchor="start">Interfaz de comandos de movimiento</text><text x="740" y="476.0" fill="#6b7f92" font-size="12" font-weight="400" text-anchor="start">Responsabilidad funcional del sistema</text></g><g class="node" data-node="navegacion" role="button" tabindex="0" aria-label="Navegación y respuesta ante obstáculos"><rect class="node-bg" x="45" y="267.5" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="45" y="285.5" width="4" height="64" rx="2" fill="#2563b9" /><text x="65" y="304.5" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Navegación y respuesta ante</text><text x="65" y="327.5" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">obstáculos</text></g><g class="node" data-node="supervision" role="button" tabindex="0" aria-label="Supervisión del sistema y detención"><rect class="node-bg" x="45" y="412.5" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="45" y="430.5" width="4" height="64" rx="2" fill="#c57024" /><text x="65" y="449.5" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Supervisión del sistema y</text><text x="65" y="472.5" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">detención</text></g><g class="node" data-node="robot" role="button" tabindex="0" aria-label="Robot simulado en Gazebo"><rect class="node-bg" x="1395" y="340.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray="6 4" /><rect x="1395" y="358.0" width="4" height="64" rx="2" fill="#65768b" /><text x="1415" y="377.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Robot simulado en Gazebo</text></g><text x="45" y="655" fill="#6b7f92" font-size="13" font-weight="400" text-anchor="start">Los elementos con borde discontinuo representan fuentes, dispositivos o resultados externos.</text></svg>