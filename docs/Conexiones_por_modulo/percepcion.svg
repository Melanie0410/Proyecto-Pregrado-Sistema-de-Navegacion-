<svg xmlns="http://www.w3.org/2000/svg" id="architecture" viewBox="0 0 1740 690" width="1740" height="690" font-family="Arial, sans-serif" role="group" aria-label="Percepción y obstáculos"><rect width="1740" height="690" fill="#fbfcfe" /><defs><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#13836d" /></marker><marker id="arrow-interaction" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#8b58bc" /></marker><marker id="arrow-decision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-motion" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-supervision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#c57024" /></marker><marker id="arrow-record" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker></defs><text x="45" y="48" fill="#18334a" font-size="27" font-weight="700" text-anchor="start">Percepción y obstáculos</text><text x="45" y="80" fill="#6b7f92" font-size="15" font-weight="400" text-anchor="start">Conexiones completas del módulo · Entradas a la izquierda · Salidas a la derecha</text><text x="45" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">ORIGEN DE LAS ENTRADAS</text><text x="740" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">MÓDULO SELECCIONADO</text><text x="1395" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">DESTINO DE LAS SALIDAS</text><g class="edge" data-flow="F09"><title>F09 · Mediciones LiDAR y profundidad</title><path class="wire" d="M345 390.0 L605 390.0 C660 390.0 665 390.0 720 390.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="475" y="359.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F09 · Mediciones LiDAR y</text><text x="475" y="376.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">profundidad</text></g><g class="edge" data-flow="F15"><title>F15 · Presencia, posición y distancia de obstáculos</title><path class="wire" d="M1060 361.0 C1115 361.0 1115 245.0 1170 245.0 L1395 245.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="1270" y="214.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F15 · Presencia, posición y</text><text x="1270" y="231.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">distancia de obstáculos</text></g><g class="edge" data-flow="F22"><title>F22 · Disponibilidad de datos de percepción</title><path class="wire" d="M1060 390.0 C1115 390.0 1115 390.0 1170 390.0 L1395 390.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="1270" y="359.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F22 · Disponibilidad de datos</text><text x="1270" y="376.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">de percepción</text></g><g class="edge" data-flow="F29"><title>F29 · Eventos de obstáculos</title><path class="wire" d="M1060 419.0 C1115 419.0 1115 535.0 1170 535.0 L1395 535.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="1270" y="504.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F29 · Eventos de obstáculos</text></g><g class="node" data-node="percepcion" role="button" tabindex="0" aria-label="Percepción y obstáculos"><rect class="node-bg" x="720" y="285.0" width="340" height="210" rx="14" fill="#edf4fd" stroke="#13836d" stroke-width="2.3" /><rect x="720" y="303.0" width="4" height="174" rx="2" fill="#13836d" /><text x="740" y="322.0" fill="#13836d" font-size="18" font-weight="700" text-anchor="start">Percepción y obstáculos</text><text x="740" y="476.0" fill="#6b7f92" font-size="12" font-weight="400" text-anchor="start">Responsabilidad funcional del sistema</text></g><g class="node" data-node="sensores" role="button" tabindex="0" aria-label="Sensores / adquisición de datos"><rect class="node-bg" x="45" y="340.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="45" y="358.0" width="4" height="64" rx="2" fill="#13836d" /><text x="65" y="377.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Sensores / adquisición de</text><text x="65" y="400.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">datos</text></g><g class="node" data-node="navegacion" role="button" tabindex="0" aria-label="Navegación y respuesta ante obstáculos"><rect class="node-bg" x="1395" y="195.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="1395" y="213.0" width="4" height="64" rx="2" fill="#2563b9" /><text x="1415" y="232.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Navegación y respuesta ante</text><text x="1415" y="255.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">obstáculos</text></g><g class="node" data-node="supervision" role="button" tabindex="0" aria-label="Supervisión del sistema y detención"><rect class="node-bg" x="1395" y="340.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="1395" y="358.0" width="4" height="64" rx="2" fill="#c57024" /><text x="1415" y="377.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Supervisión del sistema y</text><text x="1415" y="400.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">detención</text></g><g class="node" data-node="registro" role="button" tabindex="0" aria-label="Registro de pruebas"><rect class="node-bg" x="1395" y="485.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="1395" y="503.0" width="4" height="64" rx="2" fill="#65768b" /><text x="1415" y="522.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Registro de pruebas</text></g><text x="45" y="655" fill="#6b7f92" font-size="13" font-weight="400" text-anchor="start">Los elementos con borde discontinuo representan fuentes, dispositivos o resultados externos.</text></svg>