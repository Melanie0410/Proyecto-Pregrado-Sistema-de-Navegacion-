<svg xmlns="http://www.w3.org/2000/svg" id="architecture" viewBox="0 0 1740 690" width="1740" height="690" font-family="Arial, sans-serif" role="group" aria-label="Planificación de rutas"><rect width="1740" height="690" fill="#fbfcfe" /><defs><marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#13836d" /></marker><marker id="arrow-interaction" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#8b58bc" /></marker><marker id="arrow-decision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-motion" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2563b9" /></marker><marker id="arrow-supervision" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#c57024" /></marker><marker id="arrow-record" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#65768b" /></marker></defs><text x="45" y="48" fill="#18334a" font-size="27" font-weight="700" text-anchor="start">Planificación de rutas</text><text x="45" y="80" fill="#6b7f92" font-size="15" font-weight="400" text-anchor="start">Conexiones completas del módulo · Entradas a la izquierda · Salidas a la derecha</text><text x="45" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">ORIGEN DE LAS ENTRADAS</text><text x="740" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">MÓDULO SELECCIONADO</text><text x="1395" y="140" fill="#6b7f92" font-size="14" font-weight="700" text-anchor="start">DESTINO DE LAS SALIDAS</text><g class="edge" data-flow="F05"><title>F05 · Ubicación del destino seleccionado</title><path class="wire" d="M345 245.0 L605 245.0 C660 245.0 665 361.0 720 361.0" stroke="#8b58bc" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-interaction)" /><text x="475" y="214.0" class="flow-label" text-anchor="middle" fill="#8b58bc" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F05 · Ubicación del destino</text><text x="475" y="231.0" class="flow-label" text-anchor="middle" fill="#8b58bc" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">seleccionado</text></g><g class="edge" data-flow="F12"><title>F12 · Mapa del entorno</title><path class="wire" d="M345 390.0 L605 390.0 C660 390.0 665 390.0 720 390.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="475" y="359.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F12 · Mapa del entorno</text></g><g class="edge" data-flow="F13"><title>F13 · Posición y orientación estimadas</title><path class="wire" d="M345 535.0 L605 535.0 C660 535.0 665 419.0 720 419.0" stroke="#13836d" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-data)" /><text x="475" y="504.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F13 · Posición y orientación</text><text x="475" y="521.0" class="flow-label" text-anchor="middle" fill="#13836d" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">estimadas</text></g><g class="edge" data-flow="F14"><title>F14 · Ruta calculada</title><path class="wire" d="M1060 375.5 C1115 375.5 1115 317.5 1170 317.5 L1395 317.5" stroke="#2563b9" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-decision)" /><text x="1270" y="286.5" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F14 · Ruta calculada</text></g><g class="edge" data-flow="F20"><title>F20 · Resultado de planificación</title><path class="wire" d="M1060 404.5 C1115 404.5 1115 462.5 1170 462.5 L1395 462.5" stroke="#2563b9" stroke-width="2" stroke-linejoin="round" fill="none" marker-end="url(#arrow-decision)" /><text x="1270" y="431.5" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">F20 · Resultado de</text><text x="1270" y="448.5" class="flow-label" text-anchor="middle" fill="#2563b9" font-size="13" stroke="#fbfcfe" stroke-width="5" paint-order="stroke">planificación</text></g><g class="node" data-node="planificacion" role="button" tabindex="0" aria-label="Planificación de rutas"><rect class="node-bg" x="720" y="285.0" width="340" height="210" rx="14" fill="#edf4fd" stroke="#2563b9" stroke-width="2.3" /><rect x="720" y="303.0" width="4" height="174" rx="2" fill="#2563b9" /><text x="740" y="322.0" fill="#2563b9" font-size="18" font-weight="700" text-anchor="start">Planificación de rutas</text><text x="740" y="476.0" fill="#6b7f92" font-size="12" font-weight="400" text-anchor="start">Responsabilidad funcional del sistema</text></g><g class="node" data-node="destino" role="button" tabindex="0" aria-label="Selección de destino / interacción"><rect class="node-bg" x="45" y="195.0" width="300" height="100" rx="14" fill="#ffffff" stroke="#d4dfe9" stroke-width="1.5" /><rect x="45" y="213.0" width="4" height="64" rx="2" fill="#8b58bc" /><text x="65" y="232.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">Selección de destino /</text><text x="65" y="255.0" fill="#19354c" font-size="18" font-weight="700" text-anchor="start">interacción</text></g><g class="node" data-node="mapa" role="button" ta